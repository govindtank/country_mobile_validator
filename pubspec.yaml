name: country_mobile_validator
description: >-
  Validate mobile numbers per country with real length ranges (8-10, 10-11
  digits...), mobile-only type detection, and country_code_picker-friendly
  API. Pure Dart, refreshable libphonenumber metadata.
version: 0.1.0
repository: https://github.com/govindtank/country_mobile_validator
environment:
  sdk: ^3.5.0

dependencies:
  crypto: ^3.0.3

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
