name: country_mobile_validator
description: >-
  Validate mobile numbers per country using real length ranges, mobile-only detection,
  telecom carrier identification (Jio, Airtel, Vi, BSNL), WhatsApp links, and country_code_picker API.
version: 0.4.0
repository: https://github.com/govindtank/country_mobile_validator
funding:
  - https://github.com/sponsors/govindtank
  - https://buymeacoffee.com/govindtanko

topics:
  - phone-validator
  - mobile-number
  - telecom-carrier
  - e164
  - validation

environment:
  sdk: ^3.5.0

dependencies:
  crypto: ^3.0.3

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
