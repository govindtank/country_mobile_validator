<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15" />
      <stop offset="50%" stop-color="#0D1527" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)" />

  <g stroke="#1E293B" stroke-opacity="0.2" stroke-width="1">
    <path d="M0,68 H1200 M0,136 H1200 M0,204 H1200 M0,272 H1200 M0,340 H1200 M0,408 H1200 M0,476 H1200 M0,544 H1200 M0,612 H1200" />
    <path d="M68,0 V680 M136,0 V680 M204,0 V680 M272,0 V680 M340,0 V680 M408,0 V680 M476,0 V680 M544,0 V680 M612,0 V680 M680,0 V680 M748,0 V680 M816,0 V680 M884,0 V680 M952,0 V680 M1020,0 V680 M1088,0 V680 M1156,0 V680" />
  </g>

  <circle cx="240" cy="220" r="220" fill="#10B981" opacity="0.06" />
  <circle cx="950" cy="420" r="240" fill="#06B6D4" opacity="0.05" />

  <!-- Header -->
  <g transform="translate(60, 40)">
    <rect width="44" height="44" rx="10" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5" />
    <text x="22" y="29" text-anchor="middle" font-size="20">📱</text>

    <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#F8FAFC">
      country_mobile_validator
    </text>
    <text x="60" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">
      Telecom Carrier Detection • 249 Countries Mobile-Only Validation • OTP Safe • WhatsApp Links
    </text>

    <g transform="translate(940, 6)">
      <rect width="130" height="30" rx="15" fill="#064E3B" fill-opacity="0.5" stroke="#10B981" stroke-width="1.2" />
      <text x="65" y="19" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#34D399">v0.4.0 READY</text>
    </g>
  </g>

  <!-- LEFT CARD: INTERACTIVE PHONE INPUT MOCKUP -->
  <g transform="translate(60, 115)" filter="url(#shadow)">
    <rect width="560" height="520" rx="20" fill="url(#cardGrad)" stroke="#1F2937" stroke-width="1.5" />

    <g transform="translate(24, 24)">
      <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.8">REAL-TIME AUTHENTICATION INPUT</text>

      <!-- Sample 1: India Jio Mobile -->
      <g transform="translate(0, 36)">
        <text x="0" y="12" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">INDIA (+91)</text>
        <rect x="0" y="20" width="512" height="64" rx="12" fill="#030712" stroke="#10B981" stroke-width="1.8" />
        
        <rect x="12" y="32" width="75" height="40" rx="8" fill="#1E293B" />
        <text x="49" y="56" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">🇮🇳 +91</text>

        <text x="100" y="58" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#F8FAFC">70001 23456</text>

        <!-- Carrier Detection Badge -->
        <g transform="translate(365, 34)">
          <rect width="135" height="36" rx="8" fill="#0B2038" stroke="#0284C7" stroke-width="1.2" />
          <circle cx="16" cy="18" r="5" fill="#38BDF8" />
          <text x="28" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">Jio True 5G</text>
        </g>

        <!-- Verdict Line -->
        <g transform="translate(0, 94)">
          <text x="4" y="10" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#10B981">✓ OTP-Deliverable Mobile</text>
          <text x="210" y="10" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B">• Exactly 10 digits • National Carrier</text>
        </g>
      </g>

      <!-- Sample 2: Airtel India -->
      <g transform="translate(0, 160)">
        <text x="0" y="12" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">INDIA (+91)</text>
        <rect x="0" y="20" width="512" height="64" rx="12" fill="#030712" stroke="#1F2937" />
        
        <rect x="12" y="32" width="75" height="40" rx="8" fill="#1E293B" />
        <text x="49" y="56" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">🇮🇳 +91</text>

        <text x="100" y="58" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#F8FAFC">98101 44210</text>

        <g transform="translate(365, 34)">
          <rect width="135" height="36" rx="8" fill="#3B1219" stroke="#E11D48" stroke-width="1.2" />
          <circle cx="16" cy="18" r="5" fill="#FB7185" />
          <text x="28" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FB7185">Airtel 5G Plus</text>
        </g>

        <g transform="translate(0, 94)">
          <text x="4" y="10" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#10B981">✓ OTP-Deliverable Mobile</text>
          <text x="210" y="10" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B">• Delhi NCR / National</text>
        </g>
      </g>

      <!-- WhatsApp Click-to-Chat Link Pill -->
      <g transform="translate(0, 280)">
        <rect width="512" height="46" rx="10" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1" />
        <text x="18" y="28" font-size="16">💬</text>
        <text x="46" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#34D399">
          toWhatsAppUrl(): https://wa.me/917000123456
        </text>
      </g>

      <!-- Zero Dependency Badge -->
      <g transform="translate(0, 345)">
        <rect width="512" height="90" rx="12" fill="#030712" stroke="#1F2937" />
        <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10B981">PURE DART CORE • FLUTTER &amp; BACKEND READY</text>
        <line x1="18" y1="38" x2="494" y2="38" stroke="#1F2937" />
        <text x="18" y="60" font-family="-apple-system, sans-serif" font-size="11.5" fill="#94A3B8">
          Works seamlessly across Flutter apps, Shelf / Dart Frog servers, and CLI tools with sub-microsecond validation speeds.
        </text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: EXTENSION CODE & APIS -->
  <g transform="translate(650, 115)">
    <!-- Code Card -->
    <g filter="url(#shadow)">
      <rect width="490" height="375" rx="20" fill="url(#cardGrad)" stroke="#1F2937" stroke-width="1.5" />
      <text x="24" y="32" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="0.8">ZERO-BOILERPLATE STRING EXTENSIONS</text>

      <g transform="translate(24, 50)">
        <rect width="442" height="300" rx="12" fill="#030712" stroke="#1F2937" />

        <text x="18" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">// 1. Validation &amp; OTP Checks</text>
        <text x="18" y="52" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#F8FAFC">'+91 98765 43210'.<tspan fill="#34D399" font-weight="bold">isValidMobile()</tspan>;</text>
        <text x="350" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">// true</text>

        <text x="18" y="74" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#F8FAFC">'+91 1800 111 222'.<tspan fill="#F87171" font-weight="bold">isOtpDeliverable()</tspan>;</text>
        <text x="350" y="74" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">// false (toll-free)</text>

        <text x="18" y="110" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">// 2. Telecom Carrier &amp; Circle</text>
        <text x="18" y="132" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#F8FAFC">final carrier = '+91 70001 23456'.<tspan fill="#38BDF8" font-weight="bold">detectCarrier()</tspan>;</text>
        <text x="18" y="152" font-family="'JetBrains Mono', monospace" font-size="11" fill="#67E8F9">// carrier.displayName: "Jio True 5G"</text>

        <text x="18" y="188" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">// 3. WhatsApp Direct Chat Link</text>
        <text x="18" y="210" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#F8FAFC">'+91 98765 43210'.<tspan fill="#FBBF24" font-weight="bold">toWhatsAppUrl()</tspan>;</text>
        <text x="18" y="230" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FCD34D">// "https://wa.me/919876543210"</text>

        <text x="18" y="265" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">// 4. Readable National Formatting</text>
        <text x="18" y="285" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#F8FAFC">'+919876543210'.<tspan fill="#A78BFA" font-weight="bold">formatNational()</tspan>; // '98765 43210'</text>
      </g>
    </g>

    <!-- Pub Install Command -->
    <g transform="translate(0, 410)" filter="url(#shadow)">
      <rect width="490" height="110" rx="16" fill="#030712" stroke="#10B981" stroke-width="1.2" />
      <text x="24" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#10B981">INSTALL WITH 1 COMMAND</text>
      <rect x="24" y="46" width="442" height="44" rx="8" fill="#0B132B" stroke="#1E293B" />
      <text x="40" y="73" font-family="'JetBrains Mono', monospace" font-size="13" fill="#34D399">$ dart pub add country_mobile_validator</text>
    </g>
  </g>
</svg>
